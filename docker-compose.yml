services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.1
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # ── Logstash: MySQL → ES 전체 재색인 (ID 범위 분할 병렬 처리) ──────────────
  # 사용법: docker compose up logstash_1 logstash_2 logstash_3 logstash_4
  # 완료 후 컨테이너는 자동 종료됨 (restart: no)
  logstash_1:
    image: docker.elastic.co/logstash/logstash:9.2.1
    container_name: logstash_1
    restart: "no"
    depends_on:
      - elasticsearch
    command: logstash -f /usr/share/logstash/pipeline --pipeline.workers 4 --pipeline.batch.size 500
    volumes:
      - ./logstash/pipeline-1:/usr/share/logstash/pipeline
      - ./logstash/mysql-connector-j.jar:/usr/share/logstash/mysql-connector-j.jar
    profiles:
      - reindex

  logstash_2:
    image: docker.elastic.co/logstash/logstash:9.2.1
    container_name: logstash_2
    restart: "no"
    depends_on:
      - elasticsearch
    command: logstash -f /usr/share/logstash/pipeline --pipeline.workers 4 --pipeline.batch.size 500
    volumes:
      - ./logstash/pipeline-2:/usr/share/logstash/pipeline
      - ./logstash/mysql-connector-j.jar:/usr/share/logstash/mysql-connector-j.jar
    profiles:
      - reindex

  logstash_3:
    image: docker.elastic.co/logstash/logstash:9.2.1
    container_name: logstash_3
    restart: "no"
    depends_on:
      - elasticsearch
    command: logstash -f /usr/share/logstash/pipeline --pipeline.workers 4 --pipeline.batch.size 500
    volumes:
      - ./logstash/pipeline-3:/usr/share/logstash/pipeline
      - ./logstash/mysql-connector-j.jar:/usr/share/logstash/mysql-connector-j.jar
    profiles:
      - reindex

  logstash_4:
    image: docker.elastic.co/logstash/logstash:9.2.1
    container_name: logstash_4
    restart: "no"
    depends_on:
      - elasticsearch
    command: logstash -f /usr/share/logstash/pipeline --pipeline.workers 4 --pipeline.batch.size 500
    volumes:
      - ./logstash/pipeline-4:/usr/share/logstash/pipeline
      - ./logstash/mysql-connector-j.jar:/usr/share/logstash/mysql-connector-j.jar
    profiles:
      - reindex

volumes:
  esdata:
