<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Auth Test</title>
</head>
<body>
<h1>Auth 테스트 페이지</h1>

<hr>

<h2>1. 회원가입 (/api/v1/auth/signup)</h2>
<div>
    <label>
        이메일:
        <input type="email" id="signup-email" value="test@example.com">
    </label>
    <br>
    <label>
        비밀번호:
        <input type="password" id="signup-password" value="1234">
    </label>
    <br>
    <label>
        닉네임:
        <input type="text" id="signup-nickname" value="테스트유저">
    </label>
    <label>
        이름:
        <input type="text" id="signup-username" value="맹동훈">
    </label>
    <br>
    <button onclick="signup()">회원가입 요청</button>
</div>

<hr>

<h2>2. 로그인 (/api/v1/auth/login)</h2>
<div>
    <label>
        이메일:
        <input type="email" id="login-email" value="test@example.com">
    </label>
    <br>
    <label>
        비밀번호:
        <input type="password" id="login-password" value="1234">
    </label>
    <br>
    <button onclick="login()">로그인 요청 (JWT 발급)</button>
</div>

<hr>

<h2>3. 내 정보 (/api/v1/auth/me)</h2>
<div>
    <p>현재 저장된 Access Token:</p>
    <pre id="current-token" style="background:#f5f5f5; padding:8px;"></pre>
    <button onclick="getMe()">/me 호출</button>
</div>

<hr>

<h2>응답 결과</h2>
<pre id="output" style="background:#eee; padding:10px;"></pre>

<script>
    // 같은 서버에 띄운 API를 부르므로 host는 상대경로로
    const baseUrl = '/api/v1/auth';
    let accessToken = null;

    function log(data) {
        document.getElementById('output').textContent =
            typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    function showToken() {
        document.getElementById('current-token').textContent =
            accessToken ? accessToken : '(없음)';
    }

    async function signup() {
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const nickname = document.getElementById('signup-nickname').value;
        const username = document.getElementById('signup-username').value;

        try {
            const res = await fetch(`${baseUrl}/signup`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password, nickname, username })
            });

            const json = await res.json();
            log(json);
        } catch (e) {
            log('회원가입 요청 중 에러: ' + e);
        }
    }

    async function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const res = await fetch(`${baseUrl}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // 같은 오리진이면 없어도 되지만, 습관적으로 넣어도 OK
            credentials: 'include',
            body: JSON.stringify({ email, password })
        });

        const json = await res.json();
        log(json);

        if (json.success && json.data?.accessToken) { // refreshToken은 JS로 노출을 안하는 편이라고 함. 나중에 수정
            accessToken = json.data.accessToken;
            const refreshToken = json.data.refreshToken; // 이제 존재함
            document.getElementById('current-token').textContent =
                `accessToken:\n${accessToken}\n\nrefreshToken:\n${refreshToken ?? '(없음)'}`;
        }
    }

    async function getMe() {
        if (!accessToken) {
            log('먼저 로그인해서 accessToken을 받아야 합니다.');
            return;
        }

        const res = await fetch(`${baseUrl}/me`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${accessToken}` },
            credentials: 'include'
        });

        const json = await res.json();
        log(json);
    }

    // 초기 화면에서 토큰 표시
    showToken();
</script>
</body>
</html>
